<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take Quiz — Ravel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body style="background:var(--surface-muted);">

<div class="container py-4" style="max-width:760px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h5 class="mb-0" id="quizTitle">Quiz</h5>
      <div class="text-muted-soft small" id="quizClassName"></div>
    </div>
    <div class="timer-pill" id="timerPill">--:--</div>
  </div>

  <div class="quiz-progress-track mb-2"><div id="progressFill" style="width:0%"></div></div>
  <div class="d-flex justify-content-between mb-4">
    <span class="text-muted-soft small" id="questionNumber">Question 1 of 1</span>
    <span class="text-muted-soft small"><span id="quizTotalQuestions">0</span> total</span>
  </div>

  <div class="card-panel p-4 mb-4">
    <div id="questionContainer"></div>
  </div>

  <div class="d-flex justify-content-between">
    <button class="btn btn-outline-soft" id="prevBtn" disabled><i class="bi bi-arrow-left"></i> Previous</button>
    <div>
      <button class="btn btn-primary" id="nextBtn">Next <i class="bi bi-arrow-right"></i></button>
      <button class="btn btn-accent d-none" id="submitBtn">Submit Quiz</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/quiz.js"></script>
<script>initTakeQuiz();</script>
</body>
</html>
