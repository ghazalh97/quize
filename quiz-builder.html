<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Builder — Ravel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body style="background:var(--surface-muted);">

<header class="app-topbar" style="position:sticky;top:0;">
  <div class="d-flex align-items-center gap-3">
    <a href="teacher-classes.html" class="btn btn-ghost btn-sm px-2"><i class="bi bi-arrow-left fs-5"></i></a>
    <div>
      <input type="text" class="form-control form-control-sm fw-semibold border-0 px-0" id="quizTitleInput" style="font-size:1.05rem;box-shadow:none;" placeholder="Quiz title">
      <div class="text-muted-soft small" id="builderClassName"></div>
    </div>
    <span id="statusBadgeWrap"></span>
  </div>
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-outline-soft btn-sm" id="previewBtn"><i class="bi bi-eye"></i> Preview</button>
    <button class="btn btn-ghost btn-sm" id="saveBtn"><i class="bi bi-save"></i> Save</button>
    <button class="btn btn-accent btn-sm" id="publishBtn"><i class="bi bi-send-fill"></i> Publish</button>
  </div>
</header>

<div class="container-fluid py-4" style="max-width:1200px;">
  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card-panel p-3 mb-4">
        <label class="form-label small">Quiz description</label>
        <textarea class="form-control form-control-sm" id="quizDescInput" rows="2" placeholder="What is this quiz about?"></textarea>
      </div>

      <div id="questionsWrap"></div>

      <div id="noQuestionsEmpty" class="card-panel mb-4 d-none"></div>

      <div class="dropdown">
        <button class="btn btn-outline-soft w-100 py-3" data-bs-toggle="dropdown"><i class="bi bi-plus-lg"></i> Add question</button>
        <ul class="dropdown-menu w-100">
          <li><a class="dropdown-item" href="#" onclick="addQuestion('multiple_choice');return false;">Multiple choice</a></li>
          <li><a class="dropdown-item" href="#" onclick="addQuestion('multiple_select');return false;">Multiple select</a></li>
          <li><a class="dropdown-item" href="#" onclick="addQuestion('true_false');return false;">True / False</a></li>
          <li><a class="dropdown-item" href="#" onclick="addQuestion('short_answer');return false;">Short answer</a></li>
        </ul>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card-panel p-4">
        <h6 class="mb-3">Quiz settings</h6>
        <div class="row g-3">
          <div class="col-6">
            <label class="form-label small">Time limit (min)</label>
            <input type="number" class="form-control form-control-sm" id="settingTimeLimit" min="1">
          </div>
          <div class="col-6">
            <label class="form-label small">Max attempts</label>
            <input type="number" class="form-control form-control-sm" id="settingMaxAttempts" min="1">
          </div>
          <div class="col-12">
            <label class="form-label small">Start date</label>
            <input type="datetime-local" class="form-control form-control-sm" id="settingStartDate">
          </div>
          <div class="col-12">
            <label class="form-label small">Deadline</label>
            <input type="datetime-local" class="form-control form-control-sm" id="settingDeadline">
          </div>
          <div class="col-12">
            <label class="form-label small">Passing score (%)</label>
            <input type="number" class="form-control form-control-sm" id="settingPassingScore" min="0" max="100">
          </div>
        </div>
        <hr>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="settingRandomize">
          <label class="form-check-label small">Randomize questions</label>
        </div>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="settingShowCorrect">
          <label class="form-check-label small">Show correct answers after submit</label>
        </div>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="settingShowScore">
          <label class="form-check-label small">Show score immediately</label>
        </div>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="settingRequireLogin">
          <label class="form-check-label small">Require login to take quiz</label>
        </div>
        <button class="btn btn-outline-soft btn-sm w-100" id="saveSettingsBtn">Save settings</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="previewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content" style="border-radius:16px;border:none;">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title">Quiz preview</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4" id="previewBody" style="max-height:70vh;overflow-y:auto;"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/quiz-builder.js"></script>
<script>initQuizBuilder();</script>
</body>
</html>
