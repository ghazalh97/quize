<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Classes — Ravel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="appShellRoot"></div>
<div id="pageContent" class="d-none">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1">My Classes</h2>
      <p class="text-muted-soft mb-0">Manage classes, share codes, and jump into each one.</p>
    </div>
    <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#createClassModal"><i class="bi bi-plus-lg"></i> Create class</button>
  </div>
  <div class="row g-4" id="classesGrid"></div>
</div>

<div class="modal fade" id="createClassModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:16px;border:none;">
      <form id="createClassForm">
        <div class="modal-body p-4">
          <h5 class="mb-3">Create a class</h5>
          <div class="mb-3"><label class="form-label">Class name</label><input type="text" class="form-control" id="newClassName" required></div>
          <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" id="newClassDescription" rows="2"></textarea></div>
          <div class="row g-3">
            <div class="col-6"><label class="form-label">Subject</label><input type="text" class="form-control" id="newClassSubject"></div>
            <div class="col-6">
              <label class="form-label">Level</label>
              <select class="form-select" id="newClassLevel">
                <option>Beginner</option><option>Intermediate</option><option>Advanced</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0 px-4 pb-4">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-accent">Create class</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="editClassModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:16px;border:none;">
      <form id="editClassForm">
        <input type="hidden" id="editClassId">
        <div class="modal-body p-4">
          <h5 class="mb-3">Edit class</h5>
          <div class="mb-3"><label class="form-label">Class name</label><input type="text" class="form-control" id="editClassName" required></div>
          <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" id="editClassDescription" rows="2"></textarea></div>
          <div class="row g-3">
            <div class="col-6"><label class="form-label">Subject</label><input type="text" class="form-control" id="editClassSubject"></div>
            <div class="col-6">
              <label class="form-label">Level</label>
              <select class="form-select" id="editClassLevel">
                <option>Beginner</option><option>Intermediate</option><option>Advanced</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0 px-4 pb-4">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-accent">Save changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/teacher.js"></script>
<script>initTeacherClasses(); wireEditClassModal();</script>
</body>
</html>
