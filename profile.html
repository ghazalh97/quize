<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile — Ravel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="appShellRoot"></div>
<div id="pageContent" class="d-none">
  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card-panel p-4 text-center">
        <div class="avatar-circle mx-auto mb-3" style="width:72px;height:72px;font-size:1.6rem;" id="profileAvatar"></div>
        <h5 class="mb-1" id="profileName">—</h5>
        <span class="badge-soft badge-blue text-capitalize mb-2" id="profileRoleBadge">—</span>
        <p class="text-muted-soft small mb-3" id="profileJoined"></p>
        <div class="row" id="profileStats"></div>
      </div>
    </div>
    <div class="col-lg-8">
      <div class="card-panel p-4">
        <h6 class="mb-3">Edit profile</h6>
        <form id="editProfileForm">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" class="form-control" id="editFullName" required>
          </div>
          <div class="mb-4">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="editEmail" required>
          </div>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>initProfilePage();</script>
</body>
</html>
