<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Classes — Ravel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="appShellRoot"></div>
<div id="pageContent" class="d-none">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1">My Classes</h2>
      <p class="text-muted-soft mb-0">Every class you've joined, in one place.</p>
    </div>
    <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#joinClassModal"><i class="bi bi-plus-lg"></i> Join a class</button>
  </div>
  <div class="row g-4" id="classesGrid"></div>
</div>

<div class="modal fade" id="joinClassModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:16px;border:none;">
      <form id="joinClassForm">
        <div class="modal-body p-4">
          <h5 class="mb-1">Join a class</h5>
          <p class="text-muted-soft small mb-3">Enter the class code your teacher shared with you.</p>
          <input type="text" class="form-control text-uppercase" id="classCodeInput" placeholder="e.g. WEB-101" required>
        </div>
        <div class="modal-footer border-0 pt-0 px-4 pb-4">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-accent">Join class</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/student.js"></script>
<script>initStudentClasses();</script>
</body>
</html>
