<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class — Ravel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="appShellRoot"></div>
<div id="pageContent" class="d-none">
  <div class="card-panel p-4 mb-4">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
      <div>
        <h3 class="mb-1" id="className">Class name</h3>
        <p class="text-muted-soft mb-2" id="classMeta">—</p>
        <p class="mb-0" id="classDescription"></p>
      </div>
      <div id="teacherOnlyCode" class="text-end">
        <div class="text-muted-soft small mb-1">Class code</div>
        <span class="badge-soft badge-blue" style="font-size:0.95rem;" id="classCodeBadge">—</span>
      </div>
    </div>
    <div class="row g-3 mt-3">
      <div class="col-6 col-md-3">
        <div class="text-muted-soft small">Lessons</div><div class="fw-semibold" id="overviewLessonCount">0</div>
      </div>
      <div class="col-6 col-md-3">
        <div class="text-muted-soft small">Quizzes</div><div class="fw-semibold" id="overviewQuizCount">0</div>
      </div>
      <div class="col-6 col-md-3">
        <div class="text-muted-soft small">Students</div><div class="fw-semibold" id="overviewStudentCount">0</div>
      </div>
      <div class="col-6 col-md-3" id="overviewProgressWrap">
        <div class="text-muted-soft small">Your progress</div><div class="fw-semibold" id="overviewProgress">0%</div>
      </div>
    </div>
  </div>

  <ul class="nav nav-pills mb-4 flex-wrap" id="classTabs">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-overview">Overview</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-lessons">Lessons</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-materials">Materials</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-quizzes">Quizzes</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-announcements">Announcements</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-overview">
      <div class="card-panel p-4">
        <h6 class="mb-3">Class overview</h6>
        <p class="text-muted-soft small mb-0">Use the tabs above to browse lessons, materials, quizzes and announcements for this class.</p>
      </div>
    </div>

    <div class="tab-pane fade" id="tab-lessons">
      <button class="btn btn-outline-soft btn-sm mb-3 d-none" id="teacherAddLesson" data-bs-toggle="modal" data-bs-target="#addLessonModal"><i class="bi bi-plus-lg"></i> Add lesson</button>
      <div id="lessonsList"></div>
    </div>

    <div class="tab-pane fade" id="tab-materials">
      <div id="materialsList"></div>
    </div>

    <div class="tab-pane fade" id="tab-quizzes">
      <button class="btn btn-accent btn-sm mb-3 d-none" id="createQuizBtn"><i class="bi bi-plus-lg"></i> Create quiz</button>
      <div id="classQuizzesList"></div>
    </div>

    <div class="tab-pane fade" id="tab-announcements">
      <form id="newAnnouncementForm" class="card-panel p-3 mb-3 d-none">
        <div class="mb-2"><input type="text" class="form-control form-control-sm" id="annTitle" placeholder="Announcement title" required></div>
        <div class="mb-2"><textarea class="form-control form-control-sm" id="annMessage" rows="2" placeholder="Write an update for your class" required></textarea></div>
        <button type="submit" class="btn btn-accent btn-sm align-self-start">Post announcement</button>
      </form>
      <div id="announcementsList"></div>
    </div>
  </div>
</div>

<div class="modal fade" id="addLessonModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:16px;border:none;">
      <form id="addLessonForm">
        <div class="modal-body p-4">
          <h5 class="mb-3">Add a lesson</h5>
          <div class="mb-3"><label class="form-label">Title</label><input type="text" class="form-control" id="lessonTitle" required></div>
          <div class="mb-3"><label class="form-label">Short description</label><input type="text" class="form-control" id="lessonDescription"></div>
          <div class="mb-1"><label class="form-label">Content</label><textarea class="form-control" id="lessonContent" rows="4"></textarea></div>
        </div>
        <div class="modal-footer border-0 pt-0 px-4 pb-4">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-accent">Add lesson</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/student.js"></script>
<script>initClassDetail();</script>
</body>
</html>
