<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results — Ravel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="appShellRoot"></div>
<div id="pageContent" class="d-none">
  <div class="mb-4">
    <h2 class="mb-1">Results</h2>
    <p class="text-muted-soft mb-0">Every submission across your classes.</p>
  </div>

  <div class="card-panel p-3 mb-3 d-flex flex-wrap gap-2 align-items-center">
    <select class="form-select form-select-sm" style="width:220px;" id="filterQuiz"></select>
    <input type="text" class="form-control form-control-sm" style="width:220px;" id="filterStudent" placeholder="Search by student name">
    <select class="form-select form-select-sm ms-auto" style="width:200px;" id="sortResults">
      <option value="date_desc">Newest first</option>
      <option value="score_desc">Highest score</option>
      <option value="score_asc">Lowest score</option>
    </select>
  </div>

  <div class="card-panel">
    <div class="table-responsive">
      <table class="table table-clean mb-0">
        <thead><tr><th>Student</th><th>Quiz</th><th>Points</th><th>Score</th><th>Submitted</th><th>Time</th><th>Status</th></tr></thead>
        <tbody id="resultsTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="submissionDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content" style="border-radius:16px;border:none;">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title" id="submissionDetailTitle">Submission</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4" id="submissionDetailBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/student.js"></script>
<script src="assets/js/teacher.js"></script>
<script>initTeacherResults();</script>
</body>
</html>
