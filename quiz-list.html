<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizzes — Ravel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="appShellRoot"></div>
<div id="pageContent" class="d-none">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div>
      <h2 class="mb-1">Quizzes</h2>
      <p class="text-muted-soft mb-0">Everything assigned across your classes.</p>
    </div>
    <div class="btn-group">
      <button class="btn btn-outline-soft btn-sm active" data-quiz-filter="all">All</button>
      <button class="btn btn-outline-soft btn-sm" data-quiz-filter="pending">Pending</button>
      <button class="btn btn-outline-soft btn-sm" data-quiz-filter="completed">Completed</button>
    </div>
  </div>
  <div id="quizListBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/student.js"></script>
<script>initQuizList();</script>
</body>
</html>
