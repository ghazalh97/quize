<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Ravel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="appShellRoot"></div>
<div id="pageContent" class="d-none">
  <div class="mb-4">
    <h2 class="mb-1">Welcome back, <span id="welcomeName">there</span> 👋</h2>
    <p class="text-muted-soft">Here's what's happening across your classes.</p>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <div class="card-panel stat-card">
        <div class="stat-icon mb-2" style="background:#e7edfd;color:#3462e8;"><i class="bi bi-collection-fill"></i></div>
        <div class="stat-value" id="statClasses">0</div>
        <div class="stat-label">Classes</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card-panel stat-card">
        <div class="stat-icon mb-2" style="background:#fbf1de;color:#d98e1c;"><i class="bi bi-hourglass-split"></i></div>
        <div class="stat-value" id="statPending">0</div>
        <div class="stat-label">Pending quizzes</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card-panel stat-card">
        <div class="stat-icon mb-2" style="background:#e2f8f5;color:#0e8a80;"><i class="bi bi-check2-circle"></i></div>
        <div class="stat-value" id="statCompleted">0</div>
        <div class="stat-label">Completed quizzes</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card-panel stat-card">
        <div class="stat-icon mb-2" style="background:#fdeceb;color:#d9483a;"><i class="bi bi-graph-up-arrow"></i></div>
        <div class="stat-value" id="statAverage">0%</div>
        <div class="stat-label">Average score</div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card-panel p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="mb-0">Upcoming quizzes</h6>
          <a href="quiz-list.html" class="small">View all</a>
        </div>
        <div id="upcomingQuizzes"></div>
      </div>
      <div class="card-panel p-4">
        <h6 class="mb-2">Recent activity</h6>
        <div id="recentActivity"></div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0">My classes</h6>
        <button class="btn btn-outline-soft btn-sm" data-bs-toggle="modal" data-bs-target="#joinClassModal"><i class="bi bi-plus-lg"></i> Join</button>
      </div>
      <div id="myClassesMini"></div>
    </div>
  </div>
</div>

<!-- Join Class Modal -->
<div class="modal fade" id="joinClassModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:16px;border:none;">
      <form id="joinClassForm">
        <div class="modal-body p-4">
          <h5 class="mb-1">Join a class</h5>
          <p class="text-muted-soft small mb-3">Enter the class code your teacher shared with you.</p>
          <input type="text" class="form-control text-uppercase" id="classCodeInput" placeholder="e.g. WEB-101" required>
        </div>
        <div class="modal-footer border-0 pt-0 px-4 pb-4">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-accent">Join class</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/student.js"></script>
<script>initStudentDashboard();</script>
</body>
</html>
