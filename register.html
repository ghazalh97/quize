<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — Ravel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-shell">
  <div class="auth-side">
    <div class="position-relative">
      <a href="index.html" class="d-flex align-items-center gap-2 display-font fw-bold text-white mb-5" style="font-size:1.2rem;">
        <span class="brand-mark">R</span> Ravel
      </a>
      <h2 class="text-white mb-3" style="max-width:22ch;">Set up your account in under a minute.</h2>
      <p class="text-white-50" style="max-width:38ch;">Choose whether you're teaching or learning — we'll tailor the dashboard to match.</p>
    </div>
  </div>

  <div class="auth-form-col">
    <div class="w-100" style="max-width:380px;">
      <h3 class="mb-1">Create your account</h3>
      <p class="text-muted-soft mb-4">Start with a class in minutes.</p>

      <div id="formAlert" class="alert alert-danger d-none py-2 small"></div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label">I am a</label>
          <div class="row g-2">
            <div class="col-6">
              <label class="role-pick active d-flex align-items-center gap-2 mb-0" id="rolePickStudent">
                <input type="radio" name="role" value="student" checked>
                <i class="bi bi-mortarboard-fill"></i> <span class="small fw-semibold">Student</span>
              </label>
            </div>
            <div class="col-6">
              <label class="role-pick d-flex align-items-center gap-2 mb-0" id="rolePickTeacher">
                <input type="radio" name="role" value="teacher">
                <i class="bi bi-easel2-fill"></i> <span class="small fw-semibold">Teacher</span>
              </label>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="fullName">Full name</label>
          <input type="text" class="form-control" id="fullName" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" required minlength="6">
        </div>
        <div class="mb-4">
          <label class="form-label" for="confirmPassword">Confirm password</label>
          <input type="password" class="form-control" id="confirmPassword" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Create account</button>
      </form>

      <p class="text-center small text-muted-soft mt-4 mb-0">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
  redirectIfLoggedIn();
  getAppData();

  const studentPick = document.getElementById("rolePickStudent");
  const teacherPick = document.getElementById("rolePickTeacher");
  [studentPick, teacherPick].forEach(pick => {
    pick.addEventListener("click", () => {
      studentPick.classList.toggle("active", pick === studentPick);
      teacherPick.classList.toggle("active", pick === teacherPick);
    });
  });

  document.getElementById("registerForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const alertBox = document.getElementById("formAlert");
    const role = document.querySelector('input[name="role"]:checked').value;
    const result = registerUser({
      fullName: document.getElementById("fullName").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
      confirmPassword: document.getElementById("confirmPassword").value,
      role
    });
    if (!result.ok) {
      alertBox.textContent = result.message;
      alertBox.classList.remove("d-none");
      return;
    }
    alertBox.classList.add("d-none");
    showToast("Account created — welcome to Ravel!", "success");
    setTimeout(() => {
      window.location.href = role === "teacher" ? "teacher-dashboard.html" : "student-dashboard.html";
    }, 500);
  });
</script>
</body>
</html>
