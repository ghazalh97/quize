<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Ravel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div id="appShellRoot"></div>
<div id="pageContent" class="d-none">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div>
      <h2 class="mb-1">Welcome back 👋</h2>
      <p class="text-muted-soft mb-0">Here's how your classes are doing.</p>
    </div>
    <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#createClassModal"><i class="bi bi-plus-lg"></i> Create class</button>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <div class="card-panel stat-card">
        <div class="stat-icon mb-2" style="background:#e7edfd;color:#3462e8;"><i class="bi bi-people-fill"></i></div>
        <div class="stat-value" id="statStudents">0</div>
        <div class="stat-label">Total students</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card-panel stat-card">
        <div class="stat-icon mb-2" style="background:#e2f8f5;color:#0e8a80;"><i class="bi bi-collection-fill"></i></div>
        <div class="stat-value" id="statClasses">0</div>
        <div class="stat-label">Total classes</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card-panel stat-card">
        <div class="stat-icon mb-2" style="background:#fbf1de;color:#d98e1c;"><i class="bi bi-patch-question-fill"></i></div>
        <div class="stat-value" id="statQuizzes">0</div>
        <div class="stat-label">Total quizzes</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card-panel stat-card">
        <div class="stat-icon mb-2" style="background:#fdeceb;color:#d9483a;"><i class="bi bi-graph-up-arrow"></i></div>
        <div class="stat-value" id="statAverage">0%</div>
        <div class="stat-label">Average class score</div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card-panel p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="mb-0">Recent submissions</h6>
          <a href="teacher-results.html" class="small">View all</a>
        </div>
        <div id="recentSubmissions"></div>
      </div>
      <div class="card-panel p-4">
        <h6 class="mb-2">Upcoming quizzes</h6>
        <div id="upcomingQuizzes"></div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0">My classes</h6>
        <a href="teacher-classes.html" class="small">View all</a>
      </div>
      <div id="myClassesMini"></div>
    </div>
  </div>
</div>

<div class="modal fade" id="createClassModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:16px;border:none;">
      <form id="createClassForm">
        <div class="modal-body p-4">
          <h5 class="mb-3">Create a class</h5>
          <div class="mb-3"><label class="form-label">Class name</label><input type="text" class="form-control" id="newClassName" required></div>
          <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" id="newClassDescription" rows="2"></textarea></div>
          <div class="row g-3">
            <div class="col-6"><label class="form-label">Subject</label><input type="text" class="form-control" id="newClassSubject"></div>
            <div class="col-6">
              <label class="form-label">Level</label>
              <select class="form-select" id="newClassLevel">
                <option>Beginner</option><option>Intermediate</option><option>Advanced</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0 px-4 pb-4">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-accent">Create class</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/teacher.js"></script>
<script>initTeacherDashboard();</script>
</body>
</html>
